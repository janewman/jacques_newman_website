name: Publish resume

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build resume
        run: npm run build -- --pathprefix="$PAGES_BASE_PATH/"
        env:
          RESUME_ONLY: "true"
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Prepare Pages artifact
        run: |
          mkdir -p pages/assets
          cp dist/resume/index.html pages/index.html
          cp dist/assets/resume.css pages/assets/resume.css
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
